<section class="gallery-page section">
  <div class="section-inner">
    <span class="section-eyebrow">Gallery</span>
    <h1>A Look Inside</h1>
    <p>The food, the space, the moments — a glimpse of KsFoods.</p>

    <nav class="gallery-filter-tabs" aria-label="Gallery categories">
      <button class="filter-btn active" data-gallery-filter="all" aria-pressed="true">All</button>
      <button class="filter-btn" data-gallery-filter="food" aria-pressed="false">Food</button>
      <button class="filter-btn" data-gallery-filter="interior" aria-pressed="false">Interior</button>
      <button class="filter-btn" data-gallery-filter="events" aria-pressed="false">Events</button>
    </nav>

    <div class="gallery-grid" id="gallery-grid"></div>
  </div>
</section>

<div class="lightbox-overlay" id="lightbox-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lightbox-close-btn" id="lightbox-close-btn" aria-label="Close image viewer">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <button class="lightbox-nav-btn lightbox-prev" id="lightbox-prev-btn" aria-label="Previous image">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <img class="lightbox-image" id="lightbox-image" src="" alt="" />
  <button class="lightbox-nav-btn lightbox-next" id="lightbox-next-btn" aria-label="Next image">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>
