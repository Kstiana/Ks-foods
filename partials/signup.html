<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <span class="icon-circle" aria-hidden="true" style="width:52px;height:52px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </span>
      <h1>Create Your Account</h1>
      <p>Join KsFoods to save favourites, track orders, and earn rewards.</p>
    </div>

    <form class="auth-form" id="signup-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="signup-name">Full Name</label>
        <div class="input-with-icon">
          <span class="input-with-icon-prefix" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input type="text" class="form-input" id="signup-name" name="name" autocomplete="name" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-email">Email</label>
        <div class="input-with-icon">
          <span class="input-with-icon-prefix" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><polyline points="22 6 12 13 2 6"/></svg>
          </span>
          <input type="email" class="form-input" id="signup-email" name="email" autocomplete="email" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-password">Password</label>
        <div class="input-with-icon">
          <span class="input-with-icon-prefix" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" class="form-input" id="signup-password" name="password" autocomplete="new-password" required />
          <span class="input-with-icon-suffix">
            <button type="button" class="password-toggle-btn" id="signup-password-toggle" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </span>
        </div>
        <span class="form-hint">At least 6 characters</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-confirm-password">Confirm Password</label>
        <input type="password" class="form-input" id="signup-confirm-password" name="confirmPassword" autocomplete="new-password" required />
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="signup-terms" name="terms" required />
        <span class="checkbox-mark">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        <span class="checkbox-label">I agree to the Terms of Service</span>
      </label>

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>

      <div class="form-divider">or</div>

      <a href="/checkout" data-link class="btn btn-secondary btn-block">Continue as Guest</a>
    </form>

    <p class="auth-switch">Already have an account? <a href="/login" data-link>Log in</a></p>
  </div>
</div>
