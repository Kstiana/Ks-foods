<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <span class="icon-circle" aria-hidden="true" style="width:52px;height:52px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <h1>Welcome Back</h1>
      <p>Log in to track orders, save favourites, and earn loyalty points.</p>
    </div>

    <form class="auth-form" id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="login-email">Email</label>
        <div class="input-with-icon">
          <span class="input-with-icon-prefix" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><polyline points="22 6 12 13 2 6"/></svg>
          </span>
          <input type="email" class="form-input" id="login-email" name="email" autocomplete="email" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="input-with-icon">
          <span class="input-with-icon-prefix" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" class="form-input" id="login-password" name="password" autocomplete="current-password" required />
          <span class="input-with-icon-suffix">
            <button type="button" class="password-toggle-btn" id="login-password-toggle" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </span>
        </div>
      </div>

      <button type="button" class="btn btn-ghost-danger btn-sm" id="forgot-password-btn" style="align-self:flex-start;">Forgot password?</button>

      <button type="submit" class="btn btn-primary btn-block">Log In</button>

      <div class="form-divider">or</div>

      <a href="/checkout" data-link class="btn btn-secondary btn-block">Continue as Guest</a>
    </form>

    <p class="auth-switch">Don't have an account? <a href="/signup" data-link>Sign up</a></p>
  </div>
</div>
