<section class="confirmation-page section">
  <div class="section-inner">
    <div class="confirmation-empty" id="confirmation-empty" hidden>
      <div class="icon-circle" aria-hidden="true" style="width:64px;height:64px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <h1>No recent order found</h1>
      <p>Looks like there's nothing to confirm yet.</p>
      <a href="/menu" data-link class="btn btn-primary">Browse Menu</a>
    </div>

    <div class="confirmation-content" id="confirmation-content">
      <div class="confirmation-icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="16 9 11 14 8 11"/>
        </svg>
      </div>
      <h1>Order Confirmed</h1>
      <p class="confirmation-order-number">Order <span id="confirmation-order-id"></span></p>

      <div class="card confirmation-card order-confirmation-summary">
        <div class="confirmation-items" id="confirmation-items"></div>
        <div class="divider-full"></div>
        <div class="cart-summary-row">
          <span>Subtotal</span>
          <span id="confirmation-subtotal">₦0</span>
        </div>
        <div class="cart-summary-row" id="confirmation-delivery-row" hidden>
          <span>Delivery Fee</span>
          <span id="confirmation-delivery-fee">₦0</span>
        </div>
        <div class="divider-full"></div>
        <div class="cart-summary-row total">
          <span>Total</span>
          <span id="confirmation-total">₦0</span>
        </div>
      </div>

      <div class="loyalty-banner badge-gold" id="loyalty-banner" hidden>
        <span id="loyalty-points-earned"></span>
      </div>

      <div class="confirmation-actions">
        <a href="#" class="btn btn-whatsapp" id="confirmation-whatsapp-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
            <path d="M12 0C5.373 0 0 5.373 0 12c0 2.115.549 4.103 1.508 5.833L.057 23.057a.75.75 0 0 0 .943.916l5.347-1.71A11.943 11.943 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.93 0-3.738-.524-5.29-1.434l-.38-.226-3.933 1.257 1.226-3.846-.247-.394A10 10 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
          </svg>
          Confirm via WhatsApp
        </a>
        <a href="/menu" data-link class="btn btn-secondary">Back to Menu</a>
      </div>

      <p class="confirmation-note no-print">A message with your order details will open in WhatsApp — send it to let us know you're ready.</p>
    </div>
  </div>
</section>
