<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b01e1e" />
  <title>You're Offline — KsFoods</title>
  <link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand-red:      #b01e1e;
      --brand-red-dark: #4a0808;
      --brand-gold:     #c9a94a;
      --bg-page:        #faf3e0;
      --bg-surface:     #ffffff;
      --text-primary:   #1e0f0a;
      --text-secondary: #5a3e2b;
      --text-muted:     #9a7a65;
      --border-subtle:  rgba(90, 62, 43, 0.12);
      --shadow-lg:      0 8px 24px rgba(30, 10, 5, 0.13);
    }

    [data-theme="dark"] {
      --bg-page:        #120a06;
      --bg-surface:     #1e100a;
      --text-primary:   #f5ede0;
      --text-secondary: #c9a98a;
      --text-muted:     #8a6a55;
      --border-subtle:  rgba(201, 169, 138, 0.10);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #b01e1e, #4a0808);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      display: flex;
      color: #fff;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .icon {
      color: var(--brand-red);
      display: flex;
    }

    [data-theme="dark"] .icon {
      color: var(--brand-gold);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    p {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.65;
      max-width: 320px;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: var(--brand-gold);
      border-radius: 999px;
      margin: 4px 0;
    }

    .tip {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg-page);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 16px;
      width: 100%;
      text-align: left;
      line-height: 1.6;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .tip-icon {
      color: var(--brand-gold);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .tip strong {
      color: var(--text-secondary);
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 13px 28px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      text-decoration: none;
      min-height: 48px;
      margin-top: 4px;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--brand-red);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--brand-red-dark);
      box-shadow: 0 4px 12px rgba(30,10,5,0.2);
    }

    footer {
      background: linear-gradient(135deg, #b01e1e, #4a0808);
      color: rgba(255,255,255,0.5);
      text-align: center;
      padding: 14px 24px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <span class="brand-icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h18a9 6 0 0 1-18 0z"/><path d="M12 13V7"/><path d="M9 9l3-3 3 3"/></svg>
    </span>
    <span class="brand">KsFoods</span>
  </header>

  <main>
    <div class="card">
      <div class="icon" aria-hidden="true">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      </div>
      <h1>You're offline</h1>
      <div class="divider"></div>
      <p>Looks like your connection dropped. Check your network and try again — the menu will be waiting.</p>
      <div class="tip">
        <span class="tip-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
        </span>
        <span>
          <strong>While you wait</strong>
          Items you've already browsed are saved and available offline. Come back online to see the full menu and place your order.
        </span>
      </div>
      <button class="btn btn-primary" onclick="window.location.reload()">
        Try Again
      </button>
    </div>
  </main>

  <footer>
    &copy; 2026 KsFoods. All rights reserved.
  </footer>

  <script>
    const saved = localStorage.getItem('kk_theme');
    const preferred = saved ? JSON.parse(saved) : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', preferred);
  </script>
</body>
</html>
